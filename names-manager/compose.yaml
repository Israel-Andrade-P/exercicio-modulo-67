services:
  mysql:
    image: mysql:8.4
    container_name: names-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: names-app
      MYSQL_USER: zel
      MYSQL_PASSWORD: cheese
    ports:
      - "3306:3306"
    volumes: 
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: names-app
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/names-app
      SPRING_DATASOURCE_USERNAME: zel
      SPRING_DATASOURCE_PASSWORD: cheese
    depends_on:
      - mysql    

volumes:
  mysql_data:
      
